planning_plugins:
  - stomp_moveit/StompPlanner

request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision

# STOMP produces waypoints without timing — AddTimeOptimalParameterization
# assigns velocity/acceleration profiles as a post-processing step.
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath

stomp:
  num_timesteps: 60
  num_iterations: 100                # increased from 40
  num_iterations_after_valid: 5      # keep refining after finding a valid path
  num_rollouts: 30
  max_rollouts: 30
  exponentiated_cost_sensitivity: 0.5
  control_cost_weight: 0.1
  delta_t: 0.1
  num_recovery_samples: 10           # retry with fresh random init on failure
    # Make sure collision checking includes attached objects
  collision_checker_plugin: stomp_moveit::CollisionChecker
